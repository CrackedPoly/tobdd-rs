[package]
name = "tobdd"
version = "0.1.0"
edition = "2024"
authors = ["Jian Luo <crackedpoly@outlook.com>"]
description = "A blazing fast thread-safe binary decision diagram library"
keywords = ["BDD", "Rust", "Verification"]

[workspace]
members = ["benches"]

[features]
default = []
profile = ["cache_stat", "table_stat", "op_stat"]
cache_stat = ["dep:cpu-time"]
table_stat = ["dep:cpu-time"]
op_stat = ["dep:cpu-time"]

[dependencies]
cpu-time = { version = "1.0.0", optional = true }
funty = "2.0.0"
sharded-slab = "0.1.7"
papaya = { path = "../papaya/" }
ahash = "0.8.12"
spin = { version = "0.10.0", features = ["rwlock"] }

[dev-dependencies]
flate2 = "1.0.33"

[lib]
name = "tobdd"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[badges]
maintenance = { status = "actively-developed" }

[profile.dev]
overflow-checks = false

[profile.release]
overflow-checks = false
lto = true

[profile.profiling]
inherits = "release"
debug = true
